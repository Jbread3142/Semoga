<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>세모가렌탈로 이동</title>
  <script id="legacy-category-redirect">(() => {
  const targets={"043":"/categories/aircon/","075":"/categories/hvac/","008":"/","009":"/categories/laundry/","004":"/","029":"/","006":"/","080":"/categories/water/","001":"/","002":"/","005":"/categories/massage/","003":"/","010":"/","042":"/categories/commercial/","035":"/","078":"/"};
  const pathname=location.pathname.replace(/\/$/,'');
  const id=new URLSearchParams(location.search).get('ca_id');
  // Keep known category destinations; send missing/unknown IDs to the homepage.
  const targetPath=pathname==="/model/list.php"&&Object.prototype.hasOwnProperty.call(targets,id)?targets[id]:"/";
  const target=new URL(targetPath,"https://semoga.kr").href;
  const canonical=document.createElement('link');
  canonical.rel='canonical';canonical.href=target;document.head.appendChild(canonical);
  // This refresh also depends on JS, because a static host cannot read ca_id.
  // Do not add a static homepage refresh/canonical: it would misroute other IDs.
  const refresh=document.createElement('meta');
  refresh.httpEquiv='refresh';refresh.content='0; url='+target;document.head.appendChild(refresh);
  location.replace(target);
})();</script>
  <style>body{font-family:system-ui,sans-serif;max-width:48rem;margin:3rem auto;padding:0 1rem;line-height:1.7}a{color:#4436d9}</style>
</head>
<body><main><h1>세모가렌탈로 이동합니다</h1>
<noscript><p>자동 이동에는 JavaScript가 필요합니다.</p></noscript>
<p><a href="https://semoga.kr/">홈페이지 바로가기</a></p></main></body>
</html>
